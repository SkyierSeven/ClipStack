  <h1>隐私与数据</h1>

  <h2>本地存储</h2>
  <p>不会上传剪贴板内容。路径：</p>
  <table>
    <tr><th>路径</th><th>内容</th></tr>
    <tr><td><code>~/Library/Application Support/ClipStack/clipboard-data.json</code></td><td>历史与设置</td></tr>
    <tr><td><code>~/Library/Application Support/ClipStack/images/</code></td><td>图片文件</td></tr>
  </table>

  <h2>排除应用</h2>
  <p>在「设置 → 隐私」添加不想被记录的应用。无默认黑名单。</p>

  <h2>清空与重复</h2>
  <p>「清空历史」只删未固定项。从历史再复制时不会重复入库。</p>

  <div class="footer"><a href="index.html">返回目录</a></div>
