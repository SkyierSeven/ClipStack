  <a name="settings"></a>
  <p><a href="index.html">← 返回目录</a></p>
  <h1>设置</h1>
  <p>菜单栏图标 →「设置…」。打开后 Dock 会出现 ClipStack，左上角有应用菜单与帮助菜单。</p>

  <h2>通用</h2>
  <ul>
    <li><strong>暂停记录剪贴板</strong>：停止写入新历史</li>
    <li><strong>登录时启动</strong>：开机自动运行</li>
    <li><strong>复制后隐藏面板</strong>：点卡片复制后提示并收起</li>
    <li><strong>无限保留历史</strong> / 条数上限：只约束未固定条目</li>
  </ul>

  <h2>隐私</h2>
  <p>排除应用：这些 App 的复制不会被记录。</p>

  <h2>快捷键</h2>
  <p>自定义呼出历史面板的全局快捷键；冲突时请更换。</p>

  <div class="footer"><a href="index.html">返回目录</a></div>
