  <h1>设置</h1>
  <p>从菜单栏图标打开菜单 →「设置…」，或在设置窗口打开时使用左上角 ClipStack 菜单。</p>

  <h2>通用</h2>
  <ul>
    <li><strong>暂停记录剪贴板</strong>：临时停止写入新历史</li>
    <li><strong>登录时启动</strong>：开机后自动在菜单栏运行</li>
    <li><strong>复制后隐藏面板</strong>：点击卡片复制后先提示，再自动收起面板</li>
    <li><strong>无限保留历史</strong> / 条数上限：控制未固定条目的保留数量</li>
  </ul>

  <h2>隐私</h2>
  <p>可排除指定应用：来自这些应用的复制不会被记录。</p>

  <h2>快捷键</h2>
  <p>自定义呼出历史面板的全局快捷键。若与其他软件冲突，请换一组。</p>
