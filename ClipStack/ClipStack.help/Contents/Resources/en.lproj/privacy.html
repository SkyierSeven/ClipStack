  <h1>隐私与数据</h1>

  <h2>本地存储</h2>
  <p>ClipStack <strong>不会上传</strong>剪贴板内容。数据保存在本机：</p>
  <table>
    <tr><th>路径</th><th>内容</th></tr>
    <tr><td><code>~/Library/Application Support/ClipStack/clipboard-data.json</code></td><td>元数据与文本等</td></tr>
    <tr><td><code>~/Library/Application Support/ClipStack/images/</code></td><td>图片文件</td></tr>
  </table>

  <h2>排除应用</h2>
  <p>在「设置 → 隐私」中添加不想被记录的应用（例如密码管理器）。没有默认黑名单，由你自行决定。</p>

  <h2>清空</h2>
  <p>「清空历史」会删除未固定条目；固定项会保留。也可在卡片上单独删除。</p>
