<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="anchors">
  <title>快捷键 — ClipStack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a name="shortcuts"></a>
  <p><a href="index.html">← 返回目录</a></p>
  <h1>快捷键</h1>

  <h2>全局</h2>
  <table>
    <tr><th>操作</th><th>默认</th></tr>
    <tr><td>打开 / 关闭历史面板</td><td><kbd>⌘⇧X</kbd>（设置中可改）</td></tr>
  </table>

  <h2>面板内</h2>
  <table>
    <tr><th>操作</th><th>按键</th></tr>
    <tr><td>切换卡片</td><td><kbd>←</kbd> <kbd>→</kbd></td></tr>
    <tr><td>复制选中项</td><td><kbd>Enter</kbd></td></tr>
    <tr><td>快速查看</td><td><kbd>空格</kbd></td></tr>
    <tr><td>删除选中项</td><td><kbd>Delete</kbd></td></tr>
    <tr><td>关闭面板</td><td><kbd>Esc</kbd></td></tr>
  </table>

  <p class="muted">焦点在搜索框时，部分按键会交给输入框；点一下卡片区域或按 Esc 退出搜索焦点。</p>

  <div class="footer"><a href="index.html">返回目录</a></div>
</body>
</html>
